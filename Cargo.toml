[package]
name = "wisent-visuals"
version = "0.3.0"
edition = "2021"
description = "Deterministic Wisent README banners and brand charts, and the organization banner bot"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "wisent-banner"
path = "src/main.rs"

[[bin]]
name = "wisent-banner-bot"
path = "src/bin/wisent-banner-bot.rs"

[[bin]]
name = "wisent-chart"
path = "src/bin/wisent-chart.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
fontdue = "0.9"
image = "0.25"
percent-encoding = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# PNG charts are rasterised with the bundled fonts only, never the system's.
resvg = { version = "0.48", default-features = false, features = ["text"] }
roxmltree = "0.21"
sha2 = "0.10"
toml = "0.8"
ureq = "2"

[dev-dependencies]
image = "0.25"
serde_json = "1"

[[test]]
name = "banner"
path = "tests/banner/render.rs"

[[test]]
name = "bot"
path = "tests/bot/run.rs"
