[package]
name = "wisent-visuals"
version = "0.3.0"
edition = "2021"
description = "Deterministic Wisent README banners, the organization banner bot, and the release contract of the wisent-visuals Python package"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "wisent-banner"
path = "src/main.rs"

[[bin]]
name = "wisent-banner-bot"
path = "src/bin/wisent-banner-bot.rs"

[[bin]]
name = "wisent-visuals-release"
path = "src/bin/wisent-visuals-release.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
fontdue = "0.9"
image = "0.25"
percent-encoding = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
ureq = "2"
# The release contract reads the Python package's source and its published
# sdist (tar.gz) or wheel (zip), never importing it.
flate2 = "1"
tar = "0.4"
tree-sitter = "0.25"
tree-sitter-python = "0.25"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
image = "0.25"
serde_json = "1"

[[test]]
name = "banner"
path = "tests/banner/render.rs"

[[test]]
name = "bot"
path = "tests/bot/run.rs"
