name: Personalized README banner bot

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: wisent-banner-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Create organization-scoped app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.WISENT_BANNER_APP_ID }}
          private-key: ${{ secrets.WISENT_BANNER_APP_PRIVATE_KEY }}
          owner: wisent-ai

      - name: Checkout generator
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install generator
        run: python -m pip install .

      - name: Open personalized banner pull requests
        env:
          WISENT_BANNER_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          wisent-banner-bot sync \
            --org wisent-ai \
            --exclude wisent
