name: Version check

# Refuse a change whose declared version disagrees with what it did to the public
# contract. The contract of this library is what a caller can import and call: the names
# each module puts in __all__, the public methods of the classes it exports, and the keys
# of the style registry it exports. scripts/surface.py explains why that is the set.
#
# The rule itself lives in one place for the whole fleet and is not copied here:
# https://github.com/lbartoszcze/AutoVersion. This workflow supplies only the two
# things this repository alone knows: its surface, and the version it declares.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the shared rule
        run: pip install --quiet "git+https://github.com/lbartoszcze/AutoVersion@v0.1.0"

      - name: Read the public surface
        # No package dependencies: the surface is read from the source with ast, so this
        # stays cheap and cannot be broken by an unrelated dependency. A module that does
        # not parse, or an __all__ that is not a literal list, fails the step rather than
        # silently shrinking the surface.
        run: python3 scripts/surface.py > "$RUNNER_TEMP/candidate.json"

      - name: Agree with yourself about the version
        # This package states its version twice: pyproject.toml is what PyPI publishes,
        # wisent_plots/__init__.py is what callers read at runtime. Bumping one and not
        # the other ships an artifact that misreports itself, and every later comparison
        # would be measured against a version that never existed under that name.
        run: |
          set -euo pipefail
          declared="$(awk -F'"' '/^version = /{print $2; exit}' pyproject.toml)"
          runtime="$(awk -F'"' '/^__version__ = /{print $2; exit}' wisent_plots/__init__.py)"
          if [ -z "$declared" ]; then
            echo "::error::pyproject.toml declares no version."
            false
          fi
          if [ "$declared" != "$runtime" ]; then
            echo "::error::pyproject.toml declares $declared but" \
              "wisent_plots/__init__.py reports __version__ = $runtime."
            false
          fi
          echo "Both declarations agree on $declared."

      - name: Compare against the released contract
        run: |
          set -euo pipefail
          released="$(jq -r .version released-surface.json)"
          declared="$(awk -F'"' '/^version = /{print $2; exit}' pyproject.toml)"
          echo "released: $released"
          echo "declared: $declared"

          verdict="$(autoversion decide \
            --current "$released" \
            --published-surface released-surface.json \
            --candidate-surface "$RUNNER_TEMP/candidate.json" \
            --json)"
          echo "$verdict"

          change="$(printf '%s' "$verdict" | jq -r .change)"
          required="$(printf '%s' "$verdict" | jq -r .next)"

          if [ "$declared" = "$released" ]; then
            if [ "$change" != "internal" ]; then
              echo "::error::The public contract changed ($change) but pyproject.toml still" \
                "declares the released version $released. The next version must be $required."
              false
            fi
            echo "Nothing new to release and the contract is unchanged."
          elif [ "$declared" != "$required" ]; then
            echo "::error::pyproject.toml declares $declared, but a $change change to" \
              "$released requires $required."
            false
          else
            echo "Declared version matches the $change change."
          fi

      - name: Hold the baseline to what it claims about itself
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          # released-surface.json must describe an artifact somebody can install, and the
          # claim is machine-readable: the first token of "source" is a provenance marker
          # written by scripts/baseline.py. The assertion runs both ways, because both
          # directions are a real failure. Forward: a baseline claiming a registry
          # artifact must be served by that registry, or it was hand-edited and every
          # later comparison is measured against something nobody can install. Reverse: a
          # baseline claiming nothing is published must not be contradicted by the
          # registry, or it is dodging a real release and calling shipped capability
          # unreleased.
          released="$(jq -r .version released-surface.json)"
          marker="$(jq -r '.source | split(" ") | first' released-surface.json)"
          echo "baseline: $released"
          echo "marker:   $marker"

          case "$marker" in
            pypi-*) claims_registry=yes ;;
            stado:*|git-archive:*|head:*) claims_registry=no ;;
            *)
              echo "::error::unknown baseline marker: $marker. scripts/baseline.py writes" \
                "the marker; released-surface.json was edited by something else."
              false
              ;;
          esac

          # Positive control, before either assertion. Both directions below read PyPI's
          # answer through whether curl SUCCEEDS, and curl fails identically on a
          # not-found response, on no egress, and on PyPI being down. Untreated that is a
          # fail-open in the reverse direction specifically: absence is inferred from a
          # failed request, so the step would conclude "nothing is published, the baseline
          # is honest" exactly when it learned nothing — and the uninformed answer is the
          # passing one. Prove the registry is reachable first, against a project that will
          # not disappear. This also makes the forward message truthful: past this point a
          # missing version really does mean PyPI does not serve it, rather than "we could
          # not ask".
          if ! curl -sSf "https://pypi.org/pypi/pip/json" >/dev/null; then
            echo "::error::cannot reach PyPI, so nothing can be concluded about whether" \
              "wisent-visuals is published. Refusing rather than guessing."
            false
          fi

          if [ "$claims_registry" = yes ]; then
            if ! curl -sSf "https://pypi.org/pypi/wisent-visuals/$released/json" >/dev/null; then
              echo "::error::released-surface.json claims $marker, but PyPI does not serve" \
                "wisent-visuals $released. Regenerate it with scripts/baseline.py."
              false
            fi
            echo "PyPI serves the $released artifact this baseline claims."

            # Being honest about the artifact is not the same as being on the CURRENT
            # one. PyPI serves old releases forever, so the check above keeps passing
            # after a newer version ships: the baseline stays pinned to the superseded
            # release, and every later decision is measured against a contract that is
            # no longer the released one. The marker stays truthful throughout, which is
            # exactly why the bidirectional check cannot notice. `info.version` is the
            # same source of truth scripts/baseline.py resolves to pick its artifact, so
            # this asserts the committed file still agrees with it — it regenerates
            # nothing and lets no recomputed surface near the decision.
            latest="$(curl -sSf "https://pypi.org/pypi/wisent-visuals/json" | jq -r .info.version)"
            if [ "$released" != "$latest" ]; then
              echo "::error::released-surface.json is pinned to $released, but PyPI now" \
                "serves $latest as the latest release of wisent-visuals. The baseline is a" \
                "superseded artifact, so every comparison is measured against a contract" \
                "that is no longer the released one. Regenerate with scripts/baseline.py."
              false
            fi
            echo "Baseline $released is still the latest release."
          else
            if curl -sSf "https://pypi.org/pypi/wisent-visuals/json" >/dev/null; then
              echo "::error::released-surface.json claims $marker, i.e. nothing published," \
                "but PyPI does serve wisent-visuals. The baseline is dodging a real" \
                "release. Regenerate it with scripts/baseline.py."
              false
            fi
            echo "Nothing published, as the $marker baseline claims."
          fi
