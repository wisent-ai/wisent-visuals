name: Version check

# Refuse a change whose declared version disagrees with what it did to the public
# contract. The contract of this library is what a caller can import and call: the names
# each module puts in __all__, the public methods of the classes it exports, and the keys
# of the style registry it exports. scripts/surface.py explains why that is the set.
#
# The rule itself lives in one place for the whole fleet and is not copied here:
# https://github.com/lbartoszcze/AutoVersion. This workflow supplies only the two
# things this repository alone knows: its surface, and the version it declares.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the shared rule
        # Into a virtual environment, never the system interpreter. ubuntu-latest now
        # resolves to an Ubuntu whose system python3 carries the externally-managed
        # marker, so a bare `pip install` dies with
        # error: externally-managed-environment before any check runs — a gate that can
        # never pass, worth exactly what one that can never fail is worth. The venv
        # sidesteps the marker without --break-system-packages, and putting its bin on
        # GITHUB_PATH leaves every later step's `autoversion` call unchanged. This
        # repository's own scripts stay on the system python3, which is right: they
        # import the stdlib and nothing else.
        run: |
          : "${RUNNER_TEMP:=$(mktemp -d)}"
          : "${GITHUB_PATH:=$(mktemp)}"
          python3 -m venv "$RUNNER_TEMP/rule"
          "$RUNNER_TEMP/rule/bin/python" -m pip install --quiet \
            "git+https://github.com/lbartoszcze/AutoVersion@v0.1.0"
          echo "$RUNNER_TEMP/rule/bin" >> "$GITHUB_PATH"
          # GITHUB_PATH is read by the runner after this step exits, so it does nothing
          # for the assertion below. Without this prepend that assertion resolves
          # whatever `autoversion` PATH already held: command-not-found on a clean
          # runner, so permanently red — or a stranger's binary, which passes and
          # vouches for a rule nobody consulted. Measured both ways. This is the same
          # prepend GITHUB_PATH gives the later steps, applied to this one too.
          export PATH="$RUNNER_TEMP/rule/bin:$PATH"
          # `--help` is satisfied by ANY executable that exits zero, so establish WHICH
          # autoversion is about to answer before believing it. Should the prepend above
          # ever be lost in a later edit, this refuses and names the stranger, instead of
          # going green on a stranger's answer where nobody would look.
          resolved="$(command -v autoversion || true)"
          case "$resolved" in
            "$RUNNER_TEMP/rule/bin/"*) ;;
            *)
              echo "::error::autoversion resolves to '${resolved:-nothing}', outside the" \
                "venv this step just built, so nothing it answers would be the rule."
              false
              ;;
          esac
          autoversion --help > /dev/null || { echo "::error::the rule does not answer"; false; }

      - name: Read the public surface
        # No package dependencies: the surface is read from the source with ast, so this
        # stays cheap and cannot be broken by an unrelated dependency. A module that does
        # not parse, or an __all__ that is not a literal list, fails the step rather than
        # silently shrinking the surface.
        run: python3 scripts/surface.py > "$RUNNER_TEMP/candidate.json"

      - name: Agree with yourself about the version
        # This package states its version twice: pyproject.toml is what PyPI publishes,
        # wisent_plots/__init__.py is what callers read at runtime. Bumping one and not
        # the other ships an artifact that misreports itself, and every later comparison
        # would be measured against a version that never existed under that name.
        run: |
          set -euo pipefail
          declared="$(awk -F'"' '/^version = /{print $2; exit}' pyproject.toml)"
          runtime="$(awk -F'"' '/^__version__ = /{print $2; exit}' wisent_plots/__init__.py)"
          if [ -z "$declared" ]; then
            echo "::error::pyproject.toml declares no version."
            false
          fi
          if [ "$declared" != "$runtime" ]; then
            echo "::error::pyproject.toml declares $declared but" \
              "wisent_plots/__init__.py reports __version__ = $runtime."
            false
          fi
          echo "Both declarations agree on $declared."

      - name: Compare against the released contract
        run: |
          set -euo pipefail
          released="$(jq -r .version released-surface.json)"
          declared="$(awk -F'"' '/^version = /{print $2; exit}' pyproject.toml)"
          echo "released: $released"
          echo "declared: $declared"

          # Before any verdict is consumed, make this step prove that what answers to
          # `autoversion` is the rule and that this gate CAN refuse. A gate that has never
          # refused is decoration, and the liveness assertion in the install step does not
          # close that: a saboteur answering a constant `internal` passes `--help` and then
          # passes everything below, because when declared equals released `internal` IS
          # the passing branch — a fabricated verdict leaving no trace. Three known
          # answers close it, and no constant satisfies all three: a name removed reads
          # `breaking`, a name added reads `additive`, the released surface against itself
          # reads `internal`. `breaking` is by construction not `internal`, which is
          # exactly the condition refused on below, so the refusal branch is proven
          # reachable rather than assumed. This lives in the SAME step as the decide it
          # certifies, so it covers the binary that actually answers here; split into its
          # own step it could be reordered or made conditional and quietly stop covering
          # anything. The removal probe keeps a non-empty candidate deliberately — the
          # rule rejects an empty surface outright, so an empty one is not a known answer.
          jq '.surface = (.surface - [(.surface | sort | first)])' released-surface.json \
            > "$RUNNER_TEMP/one-removed.json"
          jq '.surface = (.surface + ["refusal-self-test:a-name-no-release-ever-had"])' \
            released-surface.json > "$RUNNER_TEMP/one-added.json"

          # The rule's exit status is tested explicitly, and nothing here reads a verdict
          # out of a command substitution containing a pipeline, where the status would be
          # discarded and a dead rule would read as an empty answer.
          assert_change() {
            autoversion decide --current "$released" \
              --published-surface released-surface.json \
              --candidate-surface "$candidate" --json > "$RUNNER_TEMP/probe.json" || {
                echo "::error::the rule failed on $candidate, so its verdict is unknown"
                false
              }
            change="$(jq -r .change "$RUNNER_TEMP/probe.json")"
            if [ "$change" != "$want" ]; then
              echo "::error::what answers to autoversion called $candidate '$change'" \
                "instead of '$want', so it is not the rule and its verdict about the real" \
                "candidate means nothing."
              false
            fi
            echo "$candidate reads as $want, as the rule requires."
          }

          candidate="$RUNNER_TEMP/one-removed.json"; want=breaking; assert_change
          candidate="$RUNNER_TEMP/one-added.json"; want=additive; assert_change
          candidate=released-surface.json; want=internal; assert_change

          verdict="$(autoversion decide \
            --current "$released" \
            --published-surface released-surface.json \
            --candidate-surface "$RUNNER_TEMP/candidate.json" \
            --json)"
          echo "$verdict"

          change="$(printf '%s' "$verdict" | jq -r .change)"
          required="$(printf '%s' "$verdict" | jq -r .next)"

          if [ "$declared" = "$released" ]; then
            if [ "$change" != "internal" ]; then
              echo "::error::The public contract changed ($change) but pyproject.toml still" \
                "declares the released version $released. The next version must be $required."
              false
            fi
            echo "Nothing new to release and the contract is unchanged."
          elif [ "$declared" != "$required" ]; then
            echo "::error::pyproject.toml declares $declared, but a $change change to" \
              "$released requires $required."
            false
          else
            echo "Declared version matches the $change change."
          fi

      - name: Hold the baseline to what it claims about itself
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          # released-surface.json must describe an artifact somebody can install, and the
          # claim is machine-readable: the first token of "source" is a provenance marker
          # written by scripts/baseline.py. The assertion runs both ways, because both
          # directions are a real failure. Forward: a baseline claiming a registry
          # artifact must be served by that registry, or it was hand-edited and every
          # later comparison is measured against something nobody can install. Reverse: a
          # baseline claiming nothing is published must not be contradicted by the
          # registry, or it is dodging a real release and calling shipped capability
          # unreleased.
          released="$(jq -r .version released-surface.json)"
          marker="$(jq -r '.source | split(" ") | first' released-surface.json)"

          # Ask PyPI about the project this repository ACTUALLY publishes, read out of
          # pyproject.toml rather than written here as a literal. A hardcoded name is a
          # fail-open: rename the distribution and this step keeps interrogating the old
          # one, which PyPI still serves, so the gate stays green while validating a
          # project the repository no longer ships. PyPI's absence answer is generic —
          # {"message": "Not Found"} does not name what it was asked about — so an empty
          # or wrong name would read as proven absence. Hence the name is asserted here,
          # against the repository fact, before it is ever sent.
          project="$(awk -F'"' '/^name = /{print $2; exit}' pyproject.toml)"
          if [ -z "$project" ]; then
            echo "::error::pyproject.toml declares no [project] name, so there is no subject" \
              "to ask PyPI about and absence could not be distinguished from asking wrongly."
            false
          fi
          echo "project:  $project"
          echo "baseline: $released"
          echo "marker:   $marker"

          case "$marker" in
            pypi-*) claims_registry=yes ;;
            stado:*|git-archive:*|head:*) claims_registry=no ;;
            *)
              echo "::error::unknown baseline marker: $marker. scripts/baseline.py writes" \
                "the marker; released-surface.json was edited by something else."
              false
              ;;
          esac

          # Read what PyPI SAYS, never whether curl succeeded. Under `curl -sSf` a rate
          # limit, a permission refusal and an error page all fail exactly like a
          # not-found answer, so inferring absence from a failed request concludes
          # "nothing is published, the baseline is honest" on any of them — and the
          # uninformed outcome is the passing one. So classify the answer's content into
          # four outcomes, and let only a stated absence stand as absence.
          tmp="$(mktemp -d)"
          ask() { curl -s "https://pypi.org/pypi/$1/json" > "$2" || true; }
          verdict_of() {
            if [ ! -s "$1" ]; then echo silent; return; fi
            if jq -e '.info.name' "$1" >/dev/null; then echo names; return; fi
            if jq -e '(.message // "") | ascii_downcase | contains("not found")' \
                 "$1" >/dev/null; then echo absent; return; fi
            echo unreadable
          }

          # Control, through EXACTLY the spelling used on the subject — same URL shape,
          # same jq paths, same classifier. Not a liveness ping: it proves this step can
          # still RECOGNISE a project PyPI certainly serves. Without it, a jq path that
          # silently stopped matching would refuse forever while the registry answered
          # perfectly, and the operator would blame PyPI. That is the fail-closed twin of
          # the fail-open above: same invisibility, opposite direction, equally wrong.
          ask pip "$tmp/control.json"
          case "$(verdict_of "$tmp/control.json")" in
            names) ;;
            silent)
              echo "::error::PyPI returned nothing for the control lookup, so the request did" \
                "not complete — no egress, DNS failure, or the index is down. Refusing" \
                "rather than guessing whether $project is published."
              false
              ;;
            *)
              echo "::error::this step cannot recognise pip, which PyPI certainly serves, so" \
                "any verdict it reaches about $project is meaningless. The CHECK is broken," \
                "not the registry — the answer shape changed, or jq is missing or altered."
              false
              ;;
          esac

          # One lookup for the subject, reused by every arm below: fewer requests is the
          # point when throttling is the hazard being defended against.
          ask "$project" "$tmp/subject.json"
          case "$(verdict_of "$tmp/subject.json")" in
            names) serves=yes ;;
            absent) serves=no ;;
            silent)
              echo "::error::the request to PyPI about $project returned nothing, so it did" \
                "not complete. Refusing rather than guessing whether it is published."
              false
              ;;
            *)
              echo "::error::PyPI answered about $project, but the answer neither names the" \
                "project nor states its absence — an error, permission or throttle page." \
                "The request succeeded and told us nothing. Refusing rather than guessing."
              false
              ;;
          esac

          if [ "$claims_registry" = yes ]; then
            if [ "$serves" != yes ]; then
              echo "::error::released-surface.json claims $marker, but PyPI states it does" \
                "not serve $project at all. Regenerate it with scripts/baseline.py."
              false
            fi
            if ! jq -e --arg v "$released" '.releases | has($v)' \
                 "$tmp/subject.json" >/dev/null; then
              echo "::error::released-surface.json claims $marker, but PyPI does not serve" \
                "$project $released. Regenerate it with scripts/baseline.py."
              false
            fi
            echo "PyPI serves the $released artifact this baseline claims."

            # Being honest about the artifact is not the same as being on the CURRENT one.
            # PyPI serves old releases forever, so the check above keeps passing after a
            # newer version ships: the baseline stays pinned to the superseded release, and
            # every later decision is measured against a contract that is no longer the
            # released one. The marker stays truthful throughout, which is exactly why the
            # bidirectional check cannot notice. `info.version` is the same source of truth
            # scripts/baseline.py resolves to pick its artifact, so this asserts the
            # committed file still agrees with it — it regenerates nothing and lets no
            # recomputed surface near the decision.
            latest="$(jq -r .info.version "$tmp/subject.json")"
            if [ "$released" != "$latest" ]; then
              echo "::error::released-surface.json is pinned to $released, but PyPI now" \
                "serves $latest as the latest release of $project. The baseline is a" \
                "superseded artifact, so every comparison is measured against a contract" \
                "that is no longer the released one. Regenerate with scripts/baseline.py."
              false
            fi
            echo "Baseline $released is still the latest release."
          else
            if [ "$serves" = yes ]; then
              echo "::error::released-surface.json claims $marker, i.e. nothing published," \
                "but PyPI does serve $project. The baseline is dodging a real release." \
                "Regenerate it with scripts/baseline.py."
              false
            fi
            echo "PyPI states it does not serve $project, as the $marker baseline claims."
          fi
